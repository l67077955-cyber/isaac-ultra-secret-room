<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABSOLUTE CINEMA</title>
<style>
  :root {
    --ink: #41a9e8;
    --ink-hot: #ffd23f;
    --panel: rgba(24,24,24,.97);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: #0b0b0b; color: #eee; min-height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  body { background: radial-gradient(120% 90% at 50% 0%, #141414 0%, #0b0b0b 60%); }
  .wrap {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; padding: 12px 14px 22px; min-height: 100vh; min-height: 100dvh;
  }
  .hint {
    margin: 0; text-align: center; max-width: 900px;
    font-size: clamp(12px, 1.05vw, 14.5px); line-height: 1.7; color: #9a9a9a;
    letter-spacing: .02em;
  }
  .hint b { color: var(--ink); font-weight: 600; }
  .hint kbd {
    font: 11px/1 Consolas, monospace; color: #cfcfcf; background: #1c1c1c;
    border: 1px solid #3a3a3a; border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px;
  }
  svg.main {
    display: block; flex: 0 1 auto;
    width: min(98vw, calc((100vh - 78px) * 1.53623));
    width: min(98vw, calc((100dvh - 78px) * 1.53623));
    height: auto; min-width: 300px;
    border-radius: 6px;
    box-shadow: 0 22px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.05);
  }

  /* ===== 弹出框 ===== */
  #pop {
    position: fixed; display: none; z-index: 9;
    width: min(368px, calc(100vw - 24px));
    background: linear-gradient(180deg, rgba(30,30,30,.97), rgba(15,15,15,.97));
    border: 1px solid rgba(255,210,63,.9); border-radius: 10px;
    padding: 12px 14px 13px;
    box-shadow: 0 14px 44px rgba(0,0,0,.68), 0 0 0 1px rgba(255,210,63,.07),
                inset 0 1px 0 rgba(255,255,255,.06);
    pointer-events: none;
    animation: popin .16s ease-out;
  }
  @keyframes popin {
    from { opacity: 0; transform: translateY(7px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }
  #pop .pt {
    color: var(--ink-hot); font-weight: 700; font-size: 14.5px; letter-spacing: .03em;
    margin-bottom: 7px; padding-bottom: 7px; border-bottom: 1px solid rgba(255,210,63,.22);
  }
  #pop .pd { font-size: 13px; line-height: 1.78; color: #e8e8e8; }
  #pop .pc {
    margin: 9px 0 0; background: #0a0a0a; border: 1px solid #2f2f2f; border-radius: 7px;
    padding: 8px 10px; font: 12px/1.65 Consolas, "Courier New", monospace;
    color: #9cdcfe; white-space: pre-wrap; word-break: break-all;
    max-height: 32vh; overflow: hidden;
  }

  /* ===== 透明热区 ===== */
  .hotline, .hotarea { cursor: crosshair; }
  .hotarea {
    fill: #000; fill-opacity: 0; stroke: #000; stroke-width: 2; stroke-opacity: 0;
    transition: fill-opacity .18s ease, stroke-opacity .18s ease;
  }
  .hotarea:hover, .hotarea.active {
    fill: var(--ink-hot); fill-opacity: .10; stroke: var(--ink-hot);
    stroke-opacity: .95; stroke-dasharray: 6 5;
  }
  .hotline { fill: none; stroke: #000; stroke-opacity: 0; transition: stroke-opacity .18s ease; }
  .hotline:hover, .hotline.active { stroke: var(--ink-hot); stroke-opacity: .38; }

  /* ===== 蓝色牵引线标注 ===== */
  .callout { cursor: pointer; outline: none; }
  .callout .ln {
    fill: none; stroke: var(--ink); stroke-width: 3;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .18s ease, stroke-width .18s ease;
  }
  .callout .dot {
    fill: var(--ink); stroke: #0b0b0b; stroke-width: 1.6;
    transition: fill .18s ease, r .18s ease;
  }
  .callout .lbl {
    fill: var(--ink);
    font: 600 20px "Segoe Print", "Microsoft YaHei", cursive;
    paint-order: stroke; stroke: #0b0b0b; stroke-width: 5; stroke-linejoin: round;
    transition: fill .18s ease;
  }
  .callout .hit { fill: var(--ink); fill-opacity: 0; stroke: var(--ink); stroke-opacity: 0; }
  .callout:hover .ln, .callout:focus .ln, .callout.active .ln { stroke: var(--ink-hot); stroke-width: 3.6; }
  .callout:hover .dot, .callout:focus .dot, .callout.active .dot { fill: var(--ink-hot); }
  .callout:hover .lbl, .callout:focus .lbl, .callout.active .lbl { fill: var(--ink-hot); }
</style>
</head>

<div id="pop" role="status">
  <div class="pt"></div>
  <div class="pd"></div>
  <pre class="pc"></pre>
</div>

<script>
const DATA = {
  bg: { n:1, t:'背景与暗角',
    d:'两条整幅矩形叠加：纵向线性渐变 #6d6d6d→#0a0a0a 模拟棚拍灯光由亮压暗；再用径向渐变铺一层黑色暗角（中心透明、边缘 60% 黑），把视线压向中心人物。',
    c:'linearGradient y1=0 → y2=1（顶亮底暗）\nradialGradient cx=.5 cy=.34 + 边缘黑 60%\n<rect fill="url(#bg)"/> + <rect fill="url(#vign)"/>' },
  chair: { n:2, t:'椅背',
    d:'左右各一条闭合贝塞尔路径（C 曲线）勾出椅背圆弧，直接填浅灰 #c9c9c9；再叠半透明深灰路径当作座面阴影。人物画在其上，自然形成遮挡关系。',
    c:'<path d="M0 380 C46 366 96 368 122 392 L122 548 ..." fill="#c9c9c9"/>\n座面阴影：同形 path fill="#5a5a5a" opacity=".55"' },
  suit: { n:3, t:'西装主体',
    d:'一条闭合路径从领口绕双肩到底边：M 定位 → C 画肩线弧 → L 收底 → Z 闭合，填充纵向渐变；两侧再叠 opacity .7 的亮部路径，伪造布料受光面的明暗。',
    c:'<path d="M330 296 L252 304 C214 314 ... L598 548 Z" fill="url(#suit)"/>\n亮面：<path fill="#2b2b2b" opacity=".7"/>' },
  sleeve: { n:4, t:'袖子',
    d:'不画轮廓，直接用一条直线当骨架：stroke-width:78 + stroke-linecap:round，粗描边的圆头自动生成肩部与手腕的圆角，等价于一根胶囊。手臂角度由两端点坐标控制。',
    c:'<path d="M214 330 L104 142" stroke="#141414"\n      stroke-width="78" stroke-linecap="round"/>' },
  cuff: { n:5, t:'白袖口',
    d:'矩形 rx 圆角 + transform rotate(30°)，把矩形轴线转成与手臂方向垂直，正好卡在袖管末端；左右旋转角度互为相反数做镜像。',
    c:'<rect x="62" y="128" width="78" height="34" rx="7"\n      fill="#e9e9e9" transform="rotate(30 101 145)"/>' },
  watch: { n:6, t:'手表',
    d:'在 rotate(-30°) 的局部坐标系里摆放：一个圆角矩形当表带，三个小圆点当表盘刻度。整个坐标系跟着手腕角度走，不用手工计算旋转后的坐标。',
    c:'<g transform="rotate(-30 568 178)">\n  <rect x="536" y="162" width="64" height="30" rx="6"/>\n  <circle cx="552" cy="177" r="2.6"/> ×3\n</g>' },
  hands: { n:7, t:'双手',
    d:'手掌 = 一个椭圆；五根手指 = 五条粗圆头线段（stroke-width 17~27 + linecap:round），张开的扇形角度完全由每根手指的终点坐标决定，左右手套用镜像坐标。',
    c:'<ellipse cx="86" cy="102" rx="41" ry="46" transform="rotate(-15 86 102)"/>\n<line x1="86" y1="102" x2="34" y2="10" stroke-width="20"/>\n其余四指同理，只改终点与线宽' },
  head: { n:8, t:'头部（脸/颈/耳）',
    d:'脸部是一条闭合贝塞尔路径：C 曲线依次连接额头、颧骨、下颌、下巴；颈部另画一条 path；再叠两条半透明白/灰路径做脸颊体积，无光照计算，纯手调明暗。耳朵是两个椭圆。',
    c:'<path d="M266 158 C266 112 296 98 330 98 C364 98 394 112 394 158\n         L394 196 C394 240 366 268 330 274 C294 268 266 240 266 196 Z"\n      fill="#b8b8b8"/>' },
  hair: { n:9, t:'头发',
    d:'浅灰闭合路径罩住头顶，发际线用 C 曲线收边（中间高、两侧低）；两条低饱和度细描边充当发丝高光，两侧再用椭圆补鬓角体积。',
    c:'<path d="M254 172 C246 116 272 78 330 72 C388 78 414 116 406 172 ..."\n      fill="#d8d8d8"/>\n发丝：<path stroke="#bdbdbd" stroke-width="4" fill="none"/>' },
  face5: { n:10, t:'五官',
    d:'全部是 fill:none 的细描边曲线：眉毛用 Q 曲线加粗到 7px 表现川字纹；鼻梁、鼻翼、唇线、法令纹、眼袋各一条 stroke；眼球 = ellipse 眼白 + circle 瞳孔。',
    c:'<path d="M282 180 Q300 170 318 174" stroke="#5e5e5e" stroke-width="7" fill="none"/>\n<ellipse cx="302" cy="193" rx="13" ry="7" fill="#e4e4e4"/>\n<circle cx="303" cy="193" r="4.6" fill="#3c3c3c"/>' },
  shirt: { n:11, t:'衬衫领口',
    d:'两片领子 = 两个三角形 path，中间 V 形白色路径压住脖子下缘，与深色西装形成强对比；明度上比西装主体高几个阶梯，靠色差拉开层次。',
    c:'<path d="M296 296 L330 344 L364 296 L352 288 L330 314 L308 288 Z" fill="#ececec"/>\n<path d="M296 292 L330 322 L318 286 Z" fill="#dadada"/>' },
  tie: { n:12, t:'领带',
    d:'打结处是一个小四边形 path，领带主体是下宽上窄的梯形 path，用 fill=url(#tiepat) 引用图案；花纹本身是一个 rotate(45°) 的点阵 pattern，斜向重复。',
    c:'<pattern id="tiepat" patternTransform="rotate(45)">\n  <rect fill="#4f4f4f"/><circle r="1.5" fill="#7d7d7d"/>\n</pattern>\n<path d="M322 340 L338 340 L356 468 L330 502 L304 468 Z" fill="url(#tiepat)"/>' },
  lapel: { n:13, t:'西装翻领',
    d:'左右各一条 path，颜色比西装主体更黑（#202020）形成镶边轮廓；内侧再叠一层 #2d2d2d 提亮折面，制造翻领的立体转折，绘制顺序放在衬衫和领带之上。',
    c:'<path d="M306 292 L330 338 L330 480 L284 366 C288 334 296 308 306 292 Z"\n      fill="#202020"/>\n折面：<path fill="#2d2d2d" opacity=".8"/>' },
  caption: { n:14, t:'标题字',
    d:'paint-order:stroke 让黑色描边垫在白色填色之下，字就有了干净外轮廓；textLength + lengthAdjust="spacingAndGlyphs" 强制文字拉伸到指定宽度，换任何字体都能撑满全宽、不跑版。',
    c:'<text x="330" y="522" font-size="108" stroke-width="11"\n      paint-order="stroke" textLength="624"\n      lengthAdjust="spacingAndGlyphs">CINEMA</text>' },
  grain: { n:15, t:'胶片颗粒',
    d:'SVG 滤镜合成：feTurbulence 生成分形噪声（baseFrequency 0.9）→ feColorMatrix 去饱和成灰度 → feFuncA 调透明度，整层以 30% 不透明度覆盖全图，得到黑白照片的颗粒质感。',
    c:'<filter id="grain">\n  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/>\n  <feColorMatrix type="saturate" values="0"/>\n</filter>\n<rect width="660" height="548" filter="url(#grain)" opacity="0.3"/>' }
};

const pop = document.getElementById('pop');
const pt = pop.querySelector('.pt'), pd = pop.querySelector('.pd'), pc = pop.querySelector('.pc');
let curId = null, pinned = false;

function setActive(id, on) {
  document.querySelectorAll('[data-id="' + id + '"]').forEach(el => el.classList.toggle('active', on));
}
function clearActive() {
  document.querySelectorAll('.active').forEach(el => el.classList.remove('active'));
}
function movePop(x, y) {
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let px = x + 18, py = y + 18;
  if (px + w > innerWidth - 10) px = x - w - 18;
  if (px < 10) px = 10;
  if (py + h > innerHeight - 10) py = innerHeight - h - 10;
  if (py < 10) py = 10;
  pop.style.left = px + 'px';
  pop.style.top = py + 'px';
}
function show(id, x, y) {
  const a = DATA[id];
  if (!a) return;
  pt.textContent = '#' + a.n + ' ' + a.t;
  pd.textContent = a.d;
  pc.textContent = a.c;
  pop.style.display = 'block';
  movePop(x, y);
}
function showAtEl(id, el) {
  const r = el.getBoundingClientRect();
  show(id, r.left + r.width / 2, r.top + r.height / 2);
}
function hidePop(force) {
  if (pinned && !force) return;
  pop.style.display = 'none';
}
function togglePin(id, x, y) {
  if (pinned && curId === id) {
    pinned = false; setActive(id, false); hidePop(true); curId = null;
  } else {
    if (curId && curId !== id) setActive(curId, false);
    pinned = true; curId = id; setActive(id, true); show(id, x, y);
  }
}
function unpinAll() {
  pinned = false; hidePop(true); curId = null; clearActive();
}

document.querySelectorAll('[data-id]').forEach(el => {
  const id = el.dataset.id;
  el.addEventListener('mouseenter', e => {
    if (curId && curId !== id) setActive(curId, false);
    curId = id;
    setActive(id, true);
    show(id, e.clientX, e.clientY);
  });
  el.addEventListener('mousemove', e => { if (curId === id) movePop(e.clientX, e.clientY); });
  el.addEventListener('mouseleave', () => {
    if (pinned) return;
    setActive(id, false);
    hidePop();
    curId = null;
  });
  el.addEventListener('click', e => {
    e.stopPropagation();
    togglePin(id, e.clientX, e.clientY);
  });
  /* 键盘可访问性：聚焦标注同样弹出小框 */
  el.addEventListener('focus', () => {
    if (curId && curId !== id) setActive(curId, false);
    curId = id;
    setActive(id, true);
    showAtEl(id, el);
  });
  el.addEventListener('blur', () => {
    if (pinned) return;
    setActive(id, false);
    hidePop();
    curId = null;
  });
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      e.stopPropagation();
      const r = el.getBoundingClientRect();
      togglePin(id, r.left + r.width / 2, r.top + r.height / 2);
    }
  });
});

document.addEventListener('click', () => { if (pinned) unpinAll(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (pinned || pop.style.display === 'block')) unpinAll();
});
</script>
</body>
</html>
