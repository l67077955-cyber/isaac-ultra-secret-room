<div id="wrap"><canvas id="game"></canvas></div>
<script>
'use strict';
/* =====================================================================
   愤怒的小鸟 —— Canvas + Matter.js 物理引擎版
   真实刚体旋转 / 倾倒 / 斜靠；渲染、音效、技能、关卡为自实现
   ===================================================================== */

const { Engine, Bodies, Body, Composite, Events, Sleeping } = Matter;

// ------------------------- 基础常量与工具 -------------------------
const VIEW_W = 1600, VIEW_H = 900;
const WORLD_W = 2200;
const GROUND_Y = 780;
const SLING = { x: 240, y: 616, backX: 220, backY: 626, frontX: 260, frontY: 618 };
const MAX_DRAG = 125;
const LAUNCH_K = 15.5;                 // 拉伸 px → 速度 px/s
const STEP_MS = 1000 / 60;
const GRAV_STEP = 2 * 0.001 * STEP_MS * STEP_MS;   // Matter 每步的重力速度增量 (px/step²)
const TAU = Math.PI * 2;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp  = (a, b, t) => a + (b - a) * t;
const rand  = (a, b) => a + Math.random() * (b - a);

function rr(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function starPath(c, cx, cy, R, r, n) {
  c.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n;
    const rad = i % 2 ? r : R;
    const px = cx + Math.cos(a) * rad, py = cy + Math.sin(a) * rad;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
}

// ------------------------- 音效（Web Audio 合成） -------------------------
const SFX = {
  ctx: null, ok: true, last: {},
  ensure() {
    if (!this.ctx) {
      try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { this.ok = false; }
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  throttle(key, ms) {
    const t = performance.now();
    if (this.last[key] && t - this.last[key] < ms) return true;
    this.last[key] = t; return false;
  },
  tone(f0, f1, dur, type, vol, delay = 0) {
    if (!this.ok || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  noise(dur, vol, freq, delay = 0, type = 'lowpass') {
    if (!this.ok || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const len = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t); src.stop(t + dur + 0.05);
  },
  launch()   { this.noise(0.22, 0.4, 1400); this.tone(320, 950, 0.18, 'sine', 0.16); },
  stretch(k) { this.tone(80 + k * 90, 80 + k * 90, 0.05, 'square', 0.05); },
  thud(mat) {
    if (mat === 'stone') { this.tone(78, 46, 0.1, 'square', 0.28); this.noise(0.06, 0.22, 320); }
    else if (mat === 'ice') { this.noise(0.1, 0.3, 2600, 0, 'highpass'); this.tone(1100, 620, 0.06, 'triangle', 0.12); }
    else { this.tone(150, 88, 0.08, 'square', 0.24); this.noise(0.06, 0.26, 650); }
  },
  breakSnd(mat) {
    if (mat === 'stone') { this.noise(0.3, 0.5, 260); this.tone(64, 38, 0.22, 'sine', 0.4); }
    else if (mat === 'ice') {
      this.noise(0.24, 0.42, 3200, 0, 'highpass');
      this.tone(1500, 900, 0.1, 'triangle', 0.14); this.tone(1900, 1100, 0.12, 'triangle', 0.1, 0.06);
    } else { this.noise(0.18, 0.42, 900); this.tone(190, 80, 0.12, 'square', 0.2); }
  },
  pigHurt() { if (this.throttle('pighurt', 120)) return; this.tone(520, 360, 0.1, 'square', 0.16); },
  pigDie()  { this.tone(420, 700, 0.07, 'square', 0.22); this.tone(680, 140, 0.3, 'square', 0.26, 0.07); this.noise(0.08, 0.3, 1200, 0.05); },
  pop()     { this.tone(900, 300, 0.09, 'sine', 0.18); },
  ability(type) {
    if (type === 'yellow') this.tone(500, 1500, 0.25, 'sawtooth', 0.24);
    else if (type === 'blue') { this.tone(700, 1000, 0.07, 'square', 0.2); this.tone(900, 1200, 0.07, 'square', 0.2, 0.07); this.tone(1100, 1400, 0.07, 'square', 0.2, 0.14); }
    else if (type === 'black') this.tone(300, 60, 0.3, 'sawtooth', 0.2);
  },
  explode() { this.noise(0.6, 0.75, 200); this.tone(120, 28, 0.5, 'sine', 0.5); this.noise(0.3, 0.4, 900, 0.02); },
  win()  { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, f, 0.22, 'triangle', 0.25, i * 0.13)); },
  lose() { [430, 370, 310, 240].forEach((f, i) => this.tone(f, f * 0.92, 0.3, 'sawtooth', 0.14, i * 0.18)); },
  click() { this.tone(820, 560, 0.06, 'square', 0.14); }
};

const particles = [];
const scorePops = [];
function spawnP(o) { if (particles.length < 450) particles.push(o); }
function burst(x, y, n, colors, spMin, spMax, opt = {}) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), sp = rand(spMin, spMax);
    spawnP({
      type: opt.type || 'rect', x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (opt.up || 0),
      g: opt.g !== undefined ? opt.g : 1400,
      life: rand(opt.lifeMin || 0.4, opt.lifeMax || 0.9), t: 0,
      size: rand(opt.sMin || 3, opt.sMax || 7),
      color: colors[(Math.random() * colors.length) | 0],
      rot: rand(0, TAU), rotV: rand(-8, 8)
    });
  }
}
function spawnDebris(p, kind, mat) {
  const cols = kind === 'pig' ? ['#77c14f', '#4e9a2e', '#a5d86e']
    : mat === 'stone' ? ['#a8a8a8', '#8f8f8f', '#c0c0c0']
    : mat === 'ice' ? ['rgba(180,230,255,0.9)', 'rgba(140,210,250,0.85)', '#e8f8ff']
    : ['#c98d4b', '#a06a32', '#e0b070'];
  const n = kind === 'pig' ? 16 : clamp((p.w * p.h) / 900, 6, 16);
  for (let i = 0; i < n; i++) {
    const ox = p.r ? rand(-p.r, p.r) : rand(-p.w / 2, p.w / 2);
    const oy = p.r ? rand(-p.r, p.r) : rand(-p.h / 2, p.h / 2);
    spawnP({
      type: 'rect', x: p.x + ox, y: p.y + oy,
      vx: rand(-260, 260), vy: rand(-460, -60), g: 1500,
      life: rand(0.5, 1.1), t: 0, size: rand(4, 9),
      color: cols[(Math.random() * colorsCount(cols)) | 0],
      rot: rand(0, TAU), rotV: rand(-9, 9)
    });
  }
  burst(p.x, p.y, 6, ['#ffffff'], 30, 120, { type: 'puff', g: -80, sMin: 8, sMax: 16, lifeMin: 0.3, lifeMax: 0.6 });
}
const colorsCount = c => c.length;
function spawnStars(x, y) {
  for (let i = 0; i < 6; i++) spawnP({
    type: 'star', x, y, vx: rand(-220, 220), vy: rand(-420, -120), g: 1100,
    life: rand(0.5, 0.9), t: 0, size: rand(7, 13), color: '#ffd93d', rot: rand(0, TAU), rotV: rand(-6, 6)
  });
}
function explosionFX(x, y, R) {
  spawnP({ type: 'flash', x, y, vx: 0, vy: 0, g: 0, life: 0.14, t: 0, size: R * 0.9, color: '#fff' });
  spawnP({ type: 'ring', x, y, vx: 0, vy: 0, g: 0, life: 0.42, t: 0, size: R, color: '#ffce54' });
  burst(x, y, 26, ['#ff9838', '#ffd24d', '#f06018', '#5a5a5a'], 150, 620, { up: 140, lifeMin: 0.5, lifeMax: 1.1 });
  burst(x, y, 14, ['#777', '#999'], 60, 260, { type: 'puff', g: -140, sMin: 14, sMax: 26, lifeMin: 0.6, lifeMax: 1.2 });
}
function addPop(x, y, txt, big) {
  scorePops.push({ x, y, txt, t: 0, life: 1.1, big: !!big });
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.rotV * dt;
    if (p.y > GROUND_Y - 2 && p.g > 0) { p.y = GROUND_Y - 2; p.vy *= -0.35; p.vx *= 0.7; }
  }
  for (let i = scorePops.length - 1; i >= 0; i--) {
    const s = scorePops[i];
    s.t += dt; s.y -= 55 * dt;
    if (s.t >= s.life) scorePops.splice(i, 1);
  }
}

// ------------------------- Matter 实体工厂 -------------------------
function makeBlock(x, y, w, h, mat) {
  const m = MATERIALS[mat];
  const b = Bodies.rectangle(x, y, w, h, {
    density: m.density, friction: m.fric, restitution: m.rest, frictionAir: 0
  });
  const hp = m.hpPA * w * h;
  b.plugin = { kind: 'block', mat, w, h, hp, maxHp: hp, crackSeed: Math.random() * 1000, lastHurtT: -9 };
  return b;
}
function makePig(x, y, r) {
  const m = MATERIALS.pig;
  const b = Bodies.circle(x, y, r, {
    density: m.density, friction: m.fric, restitution: m.rest, frictionAir: 0
  });
  const hp = 1150 * r * r;   // 耐久按体型（能量单位）：≥1000px/s 命中即杀，满力直击 ≈ 3.7 倍血
  b.plugin = { kind: 'pig', mat: 'pig', r, hp, maxHp: hp, blink: 0, blinkTimer: rand(1.5, 4), lastHurtT: -9 };
  return b;
}
function makeBird(type, x, y, r) {
  const m = MATERIALS.bird;
  r = r || BIRD_TYPES[type].r;
  const b = Bodies.circle(x, y, r, {
    density: m.density, friction: m.fric, restitution: m.rest, frictionAir: 0
  });
  b.plugin = { kind: 'bird', mat: 'bird', type, r };
  return b;
}

// ------------------------- 游戏主体 -------------------------
const game = {
  state: 'menu',
  levelIdx: 0,
  engine: null,
  queue: [], activeBirds: [], ghost: null,
  aimDrag: null, dragging: false, panning: false, panStartX: 0, panCamX: 0,
  camX: 0, camTarget: 0,
  score: 0, pigsTotal: 0,
  settleT: 0, delayT: 0, flyT: 0, panelT: 0, physAcc: 0,
  abilityUsed: false,
  lastTrail: [], shake: 0, time: 0,
  menuT: 0, stars: 0, finalScore: 0, bonusShown: 0,
  unlocked: 1, bestStars: [0, 0, 0, 0, 0],
  buttons: [], stretchAcc: 0, lastStretchK: 0,
  clouds: [], tufts: [], slingAnim: 0, launchPos: null, loadT: 1,

  init() {
    try {
      this.unlocked = clamp(parseInt(localStorage.getItem('ab_unlock') || '1', 10) || 1, 1, LEVELS.length);
      const bs = JSON.parse(localStorage.getItem('ab_stars') || 'null');
      if (bs && bs.length === LEVELS.length) this.bestStars = bs;
    } catch (e) { }
    for (let i = 0; i < 6; i++)
      this.clouds.push({ x: rand(0, WORLD_W), y: rand(60, 300), s: rand(0.6, 1.4), v: rand(6, 18) });
    for (let i = 0; i < 90; i++)
      this.tufts.push({ x: rand(-100, WORLD_W + 100), h: rand(6, 14), w: rand(2, 4) });

    this.engine = Engine.create({ enableSleeping: true });
    this.engine.gravity.y = 2;                    // 0.001 scale → 2000 px/s²
    this.engine.positionIterations = 8;
    this.engine.velocityIterations = 6;

    // 碰撞伤害统一入口：新接触(collisionStart)与持续接触(collisionActive)都结算。
    // 持续接触补结算的意义：塔内本就贴合的方块与猪，被撞飞的墙推挤时不会产生
    // 新接触事件——"隔墙打人"的动量转移必须靠 collisionActive 捕捉，
    // 免伤门槛与节流保证静置挤压不误伤、不重复结算。
    const onPair = (pair, isNew) => {
      const { bodyA, bodyB, collision } = pair;
      const pa = bodyA.plugin || {}, pb = bodyB.plugin || {};
      if (!pa.kind || !pb.kind) return;
      // 黑鸟：首次撞击后点燃短引信
      if (isNew) {
        if (pa.kind === 'bird' && pa.type === 'black' && pa.hitAt === undefined) pa.hitAt = this.time;
        if (pb.kind === 'bird' && pb.type === 'black' && pb.hitAt === undefined) pb.hitAt = this.time;
      }
      // 碰撞动能（统一伤害度量）：
      // E = ½ × 等效质量 × (法向相对速度² + 0.25 × 切向相对速度²)，切向打二五折代表滑蹭
      const rvx = (bodyB.velocity.x - bodyA.velocity.x) * 60;
      const rvy = (bodyB.velocity.y - bodyA.velocity.y) * 60;
      const vn = rvx * collision.normal.x + rvy * collision.normal.y;
      const vtx = rvx - vn * collision.normal.x;
      const vty = rvy - vn * collision.normal.y;
      const vt2 = 0.25 * (vtx * vtx + vty * vty);
      const mA = bodyA.isStatic ? 1e9 : bodyA.mass;
      const mB = bodyB.isStatic ? 1e9 : bodyB.mass;
      const mEff = mA * mB / (mA + mB);
      const E = 0.5 * mEff * (vn * vn + vt2);
      const sup = collision.supports && collision.supports[0];
      this.handleImpact(bodyA, bodyB, E, sup || bodyA.position);
    };
    Events.on(this.engine, 'collisionStart', ev => { for (const p of ev.pairs) onPair(p, true); });
    Events.on(this.engine, 'collisionActive', ev => { for (const p of ev.pairs) onPair(p, false); });
  },

  bodies() { return Composite.allBodies(this.engine.world); },
  ents(kind) { return this.bodies().filter(b => b.plugin && b.plugin.kind === kind); },
  pigs() { return this.ents('pig'); },

  loadLevel(i) {
    this.levelIdx = i;
    const L = LEVELS[i];
    Composite.clear(this.engine.world, false, true);
    // 地面
    const ground = Bodies.rectangle(WORLD_W / 2, GROUND_Y + 60, WORLD_W + 800, 120, {
      isStatic: true, friction: 0.85, restitution: 0.05
    });
    ground.plugin = { kind: 'ground', mat: 'ground' };
    Composite.add(this.engine.world, ground);
    for (const b of L.blocks) Composite.add(this.engine.world, makeBlock(b[0], b[1], b[2], b[3], b[4]));
    for (const p of L.pigs) Composite.add(this.engine.world, makePig(p[0], p[1], p[2]));
    this.pigsTotal = L.pigs.length;
    this.queue = L.birds.slice();
    this.score = 0;
    this.activeBirds = []; this.ghost = null;
    this.lastTrail = []; particles.length = 0; scorePops.length = 0;
    this.camX = 0; this.camTarget = 0; this.shake = 0;
    // 先跑几步让结构沉降入睡
    for (let k = 0; k < 30; k++) Engine.update(this.engine, STEP_MS);
    this.state = 'aim';
    this.loadNextBird();
  },

  loadNextBird() {
    if (this.queue.length === 0) { this.state = 'losedelay'; this.delayT = 0; return; }
    const type = this.queue.shift();
    this.ghost = { type, x: SLING.x, y: SLING.y, t: 0 };
    this.abilityUsed = false;
    this.dragging = false;
    this.state = 'aim';
    this.loadT = 0;
  },

  launch() {
    const g0 = this.ghost;
    const dx = SLING.x - g0.x, dy = SLING.y - g0.y;
    const bird = makeBird(g0.type, g0.x, g0.y);
    Sleeping.set(bird, false);
    Body.setVelocity(bird, { x: dx * LAUNCH_K / 60, y: dy * LAUNCH_K / 60 });
    Body.setAngularVelocity(bird, 0.12);
    Composite.add(this.engine.world, bird);
    this.activeBirds = [bird];
    this.ghost = null;
    this.state = 'fly'; this.flyT = 0;
    this.slingAnim = 0.001;
    this.launchPos = { x: bird.position.x, y: bird.position.y };
    SFX.launch();
    burst(bird.position.x, bird.position.y, 5, ['#ffffff'], 30, 90, { type: 'puff', g: -60, sMin: 5, sMax: 9, lifeMin: 0.25, lifeMax: 0.45 });
  },

  activateAbility() {
    const b = this.activeBirds[0];
    if (!b || this.abilityUsed || !b.plugin || b.plugin.dead) return;
    const type = b.plugin.type;
    if (!type || type === 'red') return;
    this.abilityUsed = true;
    const pos = { x: b.position.x, y: b.position.y };
    if (type === 'yellow') {
      const vx = b.velocity.x, vy = b.velocity.y;
      const sp = Math.hypot(vx, vy);
      const k = sp > 1e-4 ? Math.max(1.7, (1750 / 60) / sp) : 1.7;
      Body.setVelocity(b, { x: vx * k, y: vy * k });
      b.plugin.boostT = 0.4;
      burst(pos.x, pos.y, 12, ['#ffe14d', '#fff'], 100, 380, { type: 'spark', g: 0, lifeMin: 0.2, lifeMax: 0.5 });
    } else if (type === 'blue') {
      const sp = Math.hypot(b.velocity.x, b.velocity.y);
      const ang = Math.atan2(b.velocity.y, b.velocity.x);
      Composite.remove(this.engine.world, b);
      this.activeBirds = [];
      for (const da of [-0.2, 0, 0.2]) {
        const nb = makeBird('blue', pos.x + Math.cos(ang + da) * 6, pos.y + Math.sin(ang + da) * 6, 10);
        Sleeping.set(nb, false);
        const s2 = sp * rand(0.95, 1.1);
        Body.setVelocity(nb, { x: Math.cos(ang + da) * s2, y: Math.sin(ang + da) * s2 });
        Composite.add(this.engine.world, nb);
        this.activeBirds.push(nb);
      }
      burst(pos.x, pos.y, 8, ['#bfe8ff', '#6ec6f0'], 80, 260, { type: 'puff', g: -50, sMin: 4, sMax: 8, lifeMin: 0.25, lifeMax: 0.5 });
    } else if (type === 'black') {
      this.explode(pos.x, pos.y, 200);
      Composite.remove(this.engine.world, b);
      this.activeBirds = this.activeBirds.filter(x => x !== b);
    }
    SFX.ability(type);
  },

  // 爆炸 = 径向冲击波：冲击速度 v = 1500×√fall（fall 随距离线性衰减），
  // 伤害按同一动能公式一次性结算：E = ½·m·v²（无材质后门系数）
  explode(x, y, R) {
    explosionFX(x, y, R);
    SFX.explode();
    this.addShake(18);
    for (const b of this.bodies()) {
      if (b.isStatic || !b.plugin) continue;
      const d = Math.hypot(b.position.x - x, b.position.y - y);
      if (d > R + 60) continue;
      const fall = clamp(1 - d / (R + 60), 0, 1);
      const v = 1500 * Math.sqrt(fall);
      const nx = (b.position.x - x) / (d || 1), ny = (b.position.y - y) / (d || 1);
      if (b.plugin.kind !== 'bird' && b.plugin.kind !== 'ground') {
        this.damageBody(b, 0.5 * b.mass * v * v, true);
        if (b.plugin.dead) continue;          // 已炸毁的不再施加冲量
      }
      Sleeping.set(b, false);
      Body.setVelocity(b, {
        x: b.velocity.x + nx * v / 60,
        y: b.velocity.y + (ny * v - 150 * fall) / 60
      });
    }
  },

  addShake(a) { this.shake = Math.min(this.shake + a, 26); },

  // ---- 伤害与死亡 ----
  // 统一动能伤害：E 直接扣血（血量即耐久能量）。无特例、无随机、无系数。
  // 免伤门槛对应材料弹性极限：静置挤压与倒塌余震（<300px/s 级）不结算。
  handleImpact(a, b, E, point) {
    const E0 = 30000;
    if (E < E0) return;
    const pa = a.plugin || {}, pb = b.plugin || {};
    // 音效（按能量分级）
    const hitMat = pa.kind === 'ground' ? pb.mat : (pb.kind === 'ground' ? pa.mat : (a.mass <= b.mass ? pa.mat : pb.mat));
    if (E > 1.2e5 && !SFX.throttle('thud' + hitMat, 70)) SFX.thud(hitMat);
    if (E > 8e5) burst(point.x, point.y, 4, ['#fff'], 40, 160, { type: 'puff', g: -60, sMin: 3, sMax: 7, lifeMin: 0.2, lifeMax: 0.4 });
    // 块×块：不结算伤害（无碎片连锁碎裂，倒塌只推挤压塌）
    const blockPair = pa.kind === 'block' && pb.kind === 'block';
    if (blockPair) return;
    for (const x of [a, b]) {
      const pp = x.plugin || {};
      if (pp.dead || (pp.kind !== 'block' && pp.kind !== 'pig')) continue;
      const now = this.time;
      if (now - (pp.lastHurtT || -9) < 0.09) continue;
      pp.lastHurtT = now;
      this.damageBody(x, E);
    }
  },
  damageBody(b, dmg, silentHurt) {
    const p = b.plugin;
    if (!p || p.dead || p.kind === 'bird' || p.kind === 'ground' || dmg <= 0) return;
    Sleeping.set(b, false);
    p.hp -= dmg;
    if (p.hp <= 0) { this.killBody(b); return; }
    if (p.kind === 'pig' && !silentHurt) SFX.pigHurt();
    if (p.kind === 'block' && p.hp / p.maxHp < 0.55 && Math.random() < 0.4)
      burst(b.position.x, b.position.y, 2, p.mat === 'ice' ? ['#cfeeff'] : p.mat === 'stone' ? ['#aaa'] : ['#d8a05c'], 40, 120, { sMin: 2, sMax: 5, lifeMin: 0.3, lifeMax: 0.6 });
  },
  killBody(b) {
    const p = b.plugin;
    if (!p || p.dead) return;
    p.dead = true;
    spawnDebris({ x: b.position.x, y: b.position.y, w: p.w, h: p.h, r: p.r }, p.kind, p.mat);
    const m = MATERIALS[p.mat];
    this.score += m.score;
    addPop(b.position.x, b.position.y - 20, '+' + m.score, p.kind === 'pig');
    if (p.kind === 'pig') {
      SFX.pigDie();
      spawnStars(b.position.x, b.position.y);
      this.addShake(6);
      const pigsLeft = this.pigs().filter(x => !x.plugin.dead).length;
      if (pigsLeft === 0 && this.state !== 'windelay' && this.state !== 'win') {
        this.state = 'windelay'; this.delayT = 0;
      }
    } else {
      SFX.breakSnd(p.mat);
    }
    Composite.remove(this.engine.world, b);
    this.activeBirds = this.activeBirds.filter(x => x !== b);
  },

  // ---- 物理步进（固定 60Hz 累积器） ----
  physics(dt) {
    this.physAcc += dt;
    let steps = 0;
    while (this.physAcc >= 1 / 60 && steps < 4) {
      Engine.update(this.engine, STEP_MS);
      this.physAcc -= 1 / 60;
      steps++;
      // 出界清理
      for (const b of this.bodies()) {
        const p = b.plugin;
        if (!p || b.isStatic) continue;
        const x = b.position.x, y = b.position.y;
        if (x < -160 || x > WORLD_W + 200 || y > VIEW_H + 400) {
          if (p.kind === 'bird') {
            p.dead = true;
            if (p.trail && p.trail.length) this.lastTrail = p.trail;
            Composite.remove(this.engine.world, b);
            this.activeBirds = this.activeBirds.filter(q => q !== b);
          } else {
            this.killBody(b);
          }
        }
      }
    }
    if (steps === 4) this.physAcc = 0;
  },

  structureEnergy() {
    let e = 0;
    for (const b of this.bodies()) {
      if (b.isStatic || !b.plugin || b.plugin.kind === 'bird') continue;
      if (b.isSleeping) continue;
      e += Math.hypot(b.velocity.x, b.velocity.y) * 60 * b.mass;
    }
    return e;
  },

  endLevel(win) {
    this.state = win ? 'win' : 'lose';
    this.panelT = 0;
    const L = LEVELS[this.levelIdx];
    let bonus = 0;
    if (win) {
      const remain = this.queue.length + (this.ghost ? 1 : 0);
      bonus = remain * 10000;
      this.score += bonus;
      this.bonusShown = bonus;
    }
    this.finalScore = this.score;
    this.stars = 0;
    if (win) {
      this.stars = this.score >= L.s3 ? 3 : this.score >= L.s2 ? 2 : 1;
      if (this.stars > this.bestStars[this.levelIdx]) this.bestStars[this.levelIdx] = this.stars;
      if (this.levelIdx + 2 > this.unlocked)
        this.unlocked = Math.min(this.levelIdx + 2, LEVELS.length);
      try {
        localStorage.setItem('ab_unlock', String(this.unlocked));
        localStorage.setItem('ab_stars', JSON.stringify(this.bestStars));
      } catch (e) { }
      SFX.win();
    } else SFX.lose();
  },

  // ---- 更新 ----
  update(dt) {
    this.time += dt;
    this.menuT += dt;
    for (const c of this.clouds) {
      c.x += c.v * dt;
      if (c.x > WORLD_W + 300) c.x = -300;
    }
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 40);
    if (this.state === 'menu') return;

    this.physics(dt);
    updateParticles(dt);

    for (const b of this.pigs()) {
      const p = b.plugin;
      if (p.blink > 0) p.blink -= dt;
      else { p.blinkTimer -= dt; if (p.blinkTimer <= 0) { p.blink = 0.16; p.blinkTimer = rand(1.5, 4.5); } }
    }

    if (this.state === 'aim') {
      if (this.loadT < 1) this.loadT = Math.min(1, this.loadT + dt * 4);
      if (!this.panning) this.camTarget = 0;
      this.camX = lerp(this.camX, this.camTarget, 1 - Math.pow(0.001, dt));
    }

    if (this.state === 'fly') {
      this.flyT += dt;
      const main = this.activeBirds[0];
      if (main && !main.plugin.dead) {
        const mp = main.position;
        this.camTarget = clamp(mp.x - 620, 0, WORLD_W - VIEW_W);
        this.camX = lerp(this.camX, this.camTarget, 1 - Math.pow(0.004, dt));
        main.plugin.trailT = (main.plugin.trailT || 0) + dt;
        if (main.plugin.trailT > 0.028) {
          main.plugin.trailT = 0;
          if (!main.plugin.trail) main.plugin.trail = [];
          main.plugin.trail.push({ x: mp.x, y: mp.y });
          if (main.plugin.trail.length > 70) main.plugin.trail.shift();
        }
        if (main.plugin.type === 'yellow' && main.plugin.boostT > 0) {
          main.plugin.boostT -= dt;
          spawnP({ type: 'spark', x: mp.x - main.velocity.x * 1.2, y: mp.y - main.velocity.y * 1.2, vx: rand(-30, 30), vy: rand(-30, 30), g: 0, life: 0.3, t: 0, size: rand(3, 6), color: '#ffe14d', rot: 0, rotV: 0 });
        }
        if (main.plugin.type === 'black') {
          const sp = main.speed * 60;
          spawnP({ type: 'spark', x: mp.x + rand(-3, 3), y: mp.y - main.plugin.r - 2, vx: rand(-40, 40), vy: rand(-90, -20), g: 200, life: 0.25, t: 0, size: rand(2, 5), color: Math.random() < 0.5 ? '#ffd93d' : '#ff9838', rot: 0, rotV: 0 });
          main.plugin.contactT = (main.plugin.contactT || 0);
          if (sp < 260) main.plugin.contactT += dt;   // 低速停靠也点燃引信
          const hitAge = main.plugin.hitAt !== undefined ? this.time - main.plugin.hitAt : -1;
          if (hitAge > 0.35 || main.plugin.contactT > 0.5 || this.flyT > 6) {
            this.explode(mp.x, mp.y, 200);
            Composite.remove(this.engine.world, main);
            this.activeBirds = this.activeBirds.filter(x => x !== main);
          }
        }
      }
      // 停止判定
      for (const b of this.activeBirds.slice()) {
        if (b.plugin.dead) continue;
        const stopped = b.isSleeping || b.speed * 60 < 30;
        b.plugin.stopT = stopped ? (b.plugin.stopT || 0) + dt : 0;
        if (b.plugin.stopT > 0.8) {
          b.plugin.dead = true;
          if (b.plugin.trail && b.plugin.trail.length) this.lastTrail = b.plugin.trail;
          burst(b.position.x, b.position.y, 7, ['#fff', '#d8d8d8'], 40, 130, { type: 'puff', g: -120, sMin: 6, sMax: 12, lifeMin: 0.4, lifeMax: 0.7 });
          SFX.pop();
          Composite.remove(this.engine.world, b);
          this.activeBirds = this.activeBirds.filter(x => x !== b);
        }
      }
      if (this.activeBirds.length === 0 || this.flyT > 9) {
        if (this.activeBirds.length > 0) {
          for (const b of this.activeBirds) {
            b.plugin.dead = true;
            if (b.plugin.trail && b.plugin.trail.length) this.lastTrail = b.plugin.trail;
            Composite.remove(this.engine.world, b);
          }
          this.activeBirds = [];
        }
        if (this.state === 'fly') { this.state = 'settle'; this.settleT = 0; }
      }
    }

    if (this.state === 'settle') {
      this.settleT += dt;
      const calm = this.structureEnergy() < 260;
      if ((calm && this.settleT > 0.6) || this.settleT > 2.4) {
        this.loadNextBird();
      }
    }

    if (this.state === 'windelay') {
      this.delayT += dt;
      if (this.delayT > 1.4) this.endLevel(true);
    }
    if (this.state === 'losedelay') {
      this.delayT += dt;
      if (this.delayT > 1.6) this.endLevel(false);
    }
    if (this.state === 'win' || this.state === 'lose') this.panelT += dt;
    if (this.slingAnim > 0) this.slingAnim = Math.min(1, this.slingAnim + dt * 9);
  },

  // ---- 输入 ----
  toGame(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) / r.width * VIEW_W, y: (e.clientY - r.top) / r.height * VIEW_H };
  },
  onDown(e) {
    SFX.ensure();
    const p = this.toGame(e);
    for (const btn of this.buttons) {
      if (p.x >= btn.x && p.x <= btn.x + btn.w && p.y >= btn.y && p.y <= btn.y + btn.h) {
        SFX.click(); btn.cb(); return;
      }
    }
    if (this.state === 'aim' && this.ghost) {
      const wx = p.x + this.camX;
      const d = Math.hypot(wx - this.ghost.x, p.y - this.ghost.y);
      if (d < 80) {
        this.dragging = true;
        return;
      }
      this.panning = true; this.panStartX = p.x; this.panCamX = this.camTarget;
    } else if (this.state === 'fly') {
      this.activateAbility();
    }
  },
  onMove(e) {
    if (this.panning) {
      const p = this.toGame(e);
      this.camTarget = clamp(this.panCamX - (p.x - this.panStartX), 0, WORLD_W - VIEW_W);
      return;
    }
    if (!this.dragging) return;
    const p = this.toGame(e);
    const wx = p.x + this.camX;
    let dx = wx - SLING.x, dy = p.y - SLING.y;
    const d = Math.hypot(dx, dy);
    if (d > MAX_DRAG) { dx = dx / d * MAX_DRAG; dy = dy / d * MAX_DRAG; }
    let gx = SLING.x + dx, gy = SLING.y + dy;
    gy = Math.min(gy, GROUND_Y - 24);
    gx = Math.max(gx, 50);
    this.ghost.x = gx; this.ghost.y = gy;
    const k = Math.min(1, Math.hypot(gx - SLING.x, gy - SLING.y) / MAX_DRAG);
    this.stretchAcc += Math.abs(k - this.lastStretchK);
    this.lastStretchK = k;
    if (this.stretchAcc > 0.12) { this.stretchAcc = 0; SFX.stretch(k); }
  },
  onUp() {
    if (this.dragging) {
      this.dragging = false;
      const d = Math.hypot(this.ghost.x - SLING.x, this.ghost.y - SLING.y);
      if (d > 28) this.launch();
      else { this.ghost.x = SLING.x; this.ghost.y = SLING.y; }
      this.lastStretchK = 0;
    }
    this.panning = false;
  },
  onKey(e) {
    if (e.code === 'Space') {
      e.preventDefault();
      SFX.ensure();
      if (this.state === 'fly') this.activateAbility();
    }
  }
};

window.addEventListener('pointerdown', e => game.onDown(e));
window.addEventListener('pointermove', e => game.onMove(e));
window.addEventListener('pointerup', e => game.onUp(e));
window.addEventListener('pointercancel', e => game.onUp(e));
window.addEventListener('keydown', e => game.onKey(e));
game.init();

// =====================================================================
//                              渲 染
// =====================================================================

function drawSky(cam) {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#6db9ec'); g.addColorStop(0.6, '#a5d8f2'); g.addColorStop(1, '#d8f0fa');
  ctx.fillStyle = g;
  ctx.fillRect(cam - 10, -10, VIEW_W + 20, GROUND_Y + 10);
  const sx = cam + 190 - cam * 0.15;
  ctx.fillStyle = 'rgba(255,244,180,0.9)';
  ctx.beginPath(); ctx.arc(sx, 120, 46, 0, TAU); ctx.fill();
  ctx.fillStyle = 'rgba(255,244,180,0.18)';
  ctx.beginPath(); ctx.arc(sx, 120, 86, 0, TAU); ctx.fill();
}
function drawHills(cam) {
  ctx.fillStyle = '#b7dfae';
  const off = -cam * 0.35;
  for (let i = -1; i < 5; i++) {
    const cx = i * 520 + off + 100;
    ctx.beginPath(); ctx.arc(cx, GROUND_Y + 60, 200, Math.PI, 0); ctx.fill();
  }
  ctx.fillStyle = '#93cc7c';
  const off2 = -cam * 0.55;
  for (let i = -1; i < 6; i++) {
    const cx = i * 420 + off2 + 260;
    ctx.beginPath(); ctx.arc(cx, GROUND_Y + 80, 150, Math.PI, 0); ctx.fill();
  }
}
function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  for (const c of game.clouds) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
    ctx.beginPath();
    ctx.arc(0, 0, 34, 0, TAU); ctx.arc(36, 8, 26, 0, TAU);
    ctx.arc(-34, 10, 24, 0, TAU); ctx.arc(8, -18, 26, 0, TAU);
    ctx.fill(); ctx.restore();
  }
}
function drawGround() {
  ctx.fillStyle = '#6cb337';
  ctx.fillRect(-200, GROUND_Y, WORLD_W + 400, VIEW_H - GROUND_Y + 40);
  ctx.fillStyle = '#599e2b';
  ctx.fillRect(-200, GROUND_Y, WORLD_W + 400, 10);
  ctx.fillStyle = '#7ac847';
  ctx.fillRect(-200, GROUND_Y + 10, WORLD_W + 400, 5);
  ctx.strokeStyle = '#4c8f24'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  for (const t of game.tufts) {
    ctx.beginPath();
    ctx.moveTo(t.x, GROUND_Y + 2); ctx.lineTo(t.x - t.w, GROUND_Y + 2 - t.h);
    ctx.moveTo(t.x, GROUND_Y + 2); ctx.lineTo(t.x + t.w, GROUND_Y + 2 - t.h * 0.8);
    ctx.stroke();
  }
}

// ---- 弹弓 ----
function drawSlingArm() {
  ctx.strokeStyle = '#7a4a26'; ctx.lineCap = 'round';
  ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(SLING.x, GROUND_Y + 14); ctx.lineTo(SLING.x, 668); ctx.stroke();
  ctx.lineWidth = 13;
  ctx.beginPath(); ctx.moveTo(SLING.x, 672); ctx.lineTo(SLING.backX, SLING.backY - 6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(SLING.x, 672); ctx.lineTo(SLING.frontX, SLING.frontY - 4); ctx.stroke();
  ctx.strokeStyle = '#5d3419'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(SLING.x - 2, GROUND_Y + 6); ctx.lineTo(SLING.x - 2, 676); ctx.stroke();
}
function bandPoint() {
  const g = game.ghost;
  if (g && (game.state === 'aim')) {
    const dx = g.x - SLING.x, dy = g.y - SLING.y;
    const d = Math.hypot(dx, dy) || 1;
    return { x: g.x - dx / d * 10, y: g.y - dy / d * 10 + 4 };
  }
  if (game.slingAnim > 0 && game.slingAnim < 1 && game.launchPos) {
    const t = game.slingAnim;
    const ox = game.launchPos.x + (SLING.x - game.launchPos.x) * (t * t * (3 - 2 * t));
    const oy = game.launchPos.y + (SLING.y - game.launchPos.y) * (t * t * (3 - 2 * t));
    const over = Math.sin(t * Math.PI) * 22;
    return { x: ox - over * 0.4, y: oy - over };
  }
  return null;
}
function drawBandBack() {
  const p = bandPoint();
  ctx.strokeStyle = '#4a2c17'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(SLING.backX, SLING.backY);
  if (p) ctx.lineTo(p.x, p.y);
  else ctx.quadraticCurveTo((SLING.backX + SLING.frontX) / 2, SLING.y + 26, SLING.frontX, SLING.frontY);
  ctx.stroke();
}
function drawBandFront() {
  const p = bandPoint();
  ctx.strokeStyle = '#5d3a1e'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(SLING.frontX, SLING.frontY);
  if (p) ctx.lineTo(p.x, p.y - 3);
  else ctx.quadraticCurveTo((SLING.backX + SLING.frontX) / 2, SLING.y + 24, SLING.backX, SLING.backY);
  ctx.stroke();
}

// ---- 小鸟 ----
function drawBird(x, y, r, type, angle, opts = {}) {
  const c = ctx;
  c.save(); c.translate(x, y); c.rotate(angle || 0);
  const blink = opts.blink;
  if (type === 'red') {
    c.fillStyle = '#3a2a20';
    for (const a of [-0.35, -0.1, 0.15]) {
      c.save(); c.rotate(a); rr(c, -r * 1.5, -3, r * 0.75, 6, 3); c.fill(); c.restore();
    }
    let g = c.createRadialGradient(-r * 0.25, -r * 0.35, r * 0.2, 0, 0, r * 1.15);
    g.addColorStop(0, '#f0563f'); g.addColorStop(1, '#c22424');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = '#8e1a14'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#f6d8a8';
    c.beginPath(); c.ellipse(r * 0.1, r * 0.5, r * 0.55, r * 0.38, 0, 0, TAU); c.fill();
    c.fillStyle = '#e84a35'; c.strokeStyle = '#8e1a14'; c.lineWidth = 1.5;
    c.save(); c.translate(-r * 0.3, -r * 0.95); c.rotate(-0.5);
    c.beginPath(); c.ellipse(0, 0, r * 0.13, r * 0.3, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
    c.save(); c.translate(-r * 0.05, -r * 1.05); c.rotate(-0.15);
    c.beginPath(); c.ellipse(0, 0, r * 0.12, r * 0.32, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
    drawFace(c, r, { brow: '#2b2b2b', browW: r * 0.2, eyeR: r * 0.26, blink });
  } else if (type === 'yellow') {
    c.fillStyle = '#3a2a20';
    c.save(); c.rotate(-0.2); rr(c, -r * 1.5, -3, r * 0.7, 6, 3); c.fill(); c.restore();
    let g = c.createRadialGradient(-r * 0.2, -r * 0.3, r * 0.2, 0, 0, r * 1.1);
    g.addColorStop(0, '#ffd95a'); g.addColorStop(1, '#eda70e');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = '#b87b06'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#fdf3d0';
    c.beginPath(); c.ellipse(r * 0.1, r * 0.5, r * 0.5, r * 0.33, 0, 0, TAU); c.fill();
    c.fillStyle = '#2b2b2b';
    c.save(); c.translate(-r * 0.15, -r * 1.0); c.rotate(-0.35);
    c.beginPath(); c.ellipse(0, 0, r * 0.11, r * 0.3, 0, 0, TAU); c.fill(); c.restore();
    drawFace(c, r, { brow: '#1d1d1d', browW: r * 0.24, eyeR: r * 0.24, blink });
  } else if (type === 'blue') {
    c.fillStyle = '#2b3a45';
    c.save(); c.rotate(-0.2); rr(c, -r * 1.5, -2.5, r * 0.7, 5, 2.5); c.fill(); c.restore();
    let g = c.createRadialGradient(-r * 0.2, -r * 0.3, r * 0.2, 0, 0, r * 1.1);
    g.addColorStop(0, '#8fd4f5'); g.addColorStop(1, '#4aa3d8');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = '#2d6e9e'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#2b3a45';
    c.save(); c.translate(-r * 0.1, -r * 1.0); c.rotate(-0.3);
    c.beginPath(); c.ellipse(0, 0, r * 0.12, r * 0.35, 0, 0, TAU); c.fill(); c.restore();
    drawFace(c, r, { brow: '#1d3a4e', browW: r * 0.16, eyeR: r * 0.3, blink });
  } else if (type === 'black') {
    c.fillStyle = '#1a1a1a';
    for (const a of [-0.3, 0, 0.3]) {
      c.save(); c.rotate(a); rr(c, -r * 1.5, -3, r * 0.7, 6, 3); c.fill(); c.restore();
    }
    let g = c.createRadialGradient(-r * 0.25, -r * 0.35, r * 0.2, 0, 0, r * 1.15);
    g.addColorStop(0, '#4a4a56'); g.addColorStop(1, '#1e1e26');
    c.fillStyle = g; c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
    c.strokeStyle = '#101014'; c.lineWidth = 2; c.stroke();
    c.fillStyle = '#6e6e78';
    c.beginPath(); c.ellipse(r * 0.08, r * 0.52, r * 0.5, r * 0.34, 0, 0, TAU); c.fill();
    c.fillStyle = '#f08030'; c.strokeStyle = '#b85818'; c.lineWidth = 1.5;
    c.save(); c.translate(-r * 0.1, -r * 0.98); c.rotate(-0.25);
    c.beginPath(); c.ellipse(0, 0, r * 0.14, r * 0.3, 0, 0, TAU); c.fill(); c.stroke(); c.restore();
    drawFace(c, r, { brow: '#000', browW: r * 0.22, eyeR: r * 0.2, blink, angry: true });
  }
  c.restore();
}
function drawFace(c, r, o) {
  const ex1 = r * 0.3, ex2 = r * 0.72, ey = -r * 0.28;
  for (const ex of [ex1, ex2]) {
    if (o.blink) {
      c.strokeStyle = '#333'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(ex - r * 0.18, ey); c.lineTo(ex + r * 0.18, ey); c.stroke();
    } else {
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(ex, ey, o.eyeR, 0, TAU); c.fill();
      c.strokeStyle = 'rgba(0,0,0,0.25)'; c.lineWidth = 1; c.stroke();
      c.fillStyle = '#1a1a1a';
      c.beginPath(); c.arc(ex + o.eyeR * 0.35, ey, o.eyeR * 0.42, 0, TAU); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(ex + o.eyeR * 0.5, ey - o.eyeR * 0.2, o.eyeR * 0.15, 0, TAU); c.fill();
    }
  }
  c.save();
  c.translate(r * 0.48, ey - o.eyeR - r * 0.1);
  c.rotate(o.angry ? 0.3 : 0.2);
  c.fillStyle = o.brow;
  rr(c, -r * 0.5, -o.browW / 2, r, o.browW, o.browW / 2); c.fill();
  c.restore();
  c.fillStyle = '#f5a623'; c.strokeStyle = '#c77e0a'; c.lineWidth = 1.5;
  c.beginPath();
  c.moveTo(r * 0.78, -r * 0.02); c.lineTo(r * 1.42, r * 0.1); c.lineTo(r * 0.82, r * 0.22);
  c.closePath(); c.fill(); c.stroke();
  c.fillStyle = '#e08e12';
  c.beginPath();
  c.moveTo(r * 0.8, r * 0.2); c.lineTo(r * 1.28, r * 0.26); c.lineTo(r * 0.82, r * 0.36);
  c.closePath(); c.fill(); c.stroke();
}

// ---- 猪 ----
function drawPig(x, y, r, hpRatio, blink, lookAt, id) {
  const c = ctx;
  c.save(); c.translate(x, y);
  const squish = 1 + Math.sin(game.time * 3 + (id || 0)) * 0.015;
  c.scale(1 / squish, squish);
  c.fillStyle = '#5aa233'; c.strokeStyle = '#3e7d22'; c.lineWidth = 2;
  for (const s of [-1, 1]) {
    c.beginPath(); c.arc(s * r * 0.55, -r * 0.85, r * 0.24, 0, TAU); c.fill(); c.stroke();
  }
  let g = c.createRadialGradient(-r * 0.25, -r * 0.35, r * 0.15, 0, 0, r * 1.15);
  g.addColorStop(0, hpRatio > 0.35 ? '#94d86a' : '#7fae56'); g.addColorStop(1, hpRatio > 0.35 ? '#4e9a2e' : '#40702a');
  c.fillStyle = g;
  c.beginPath(); c.arc(0, 0, r, 0, TAU); c.fill();
  c.strokeStyle = '#3e7d22'; c.lineWidth = 2.5; c.stroke();
  let lx = 0, ly = 0;
  if (lookAt) { const dx = lookAt.x - x, dy = lookAt.y - y, d = Math.hypot(dx, dy) || 1; lx = dx / d * r * 0.07; ly = dy / d * r * 0.07; }
  for (const s of [-1, 1]) {
    const ex = s * r * 0.5, ey = -r * 0.35;
    if (blink > 0) {
      c.strokeStyle = '#2f5c18'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(ex - r * 0.16, ey); c.lineTo(ex + r * 0.16, ey); c.stroke();
    } else {
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(ex, ey, r * 0.21, 0, TAU); c.fill();
      c.fillStyle = '#1a1a1a';
      c.beginPath(); c.arc(ex + lx, ey + ly, r * 0.09, 0, TAU); c.fill();
    }
  }
  if (hpRatio < 0.6) {
    c.strokeStyle = '#2f5c18'; c.lineWidth = 2.5; c.lineCap = 'round';
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(s * r * 0.32, -r * 0.62); c.lineTo(s * r * 0.68, -r * 0.52);
      c.stroke();
    }
    c.fillStyle = 'rgba(46,84,28,0.35)';
    c.beginPath(); c.arc(r * 0.5, r * 0.3, r * 0.24, 0, TAU); c.fill();
  }
  if (hpRatio < 0.3) {
    c.fillStyle = 'rgba(46,84,28,0.35)';
    c.beginPath(); c.arc(-r * 0.55, r * 0.35, r * 0.2, 0, TAU); c.fill();
  }
  c.fillStyle = '#a8e07a'; c.strokeStyle = '#3e7d22'; c.lineWidth = 2;
  c.beginPath(); c.ellipse(0, r * 0.02, r * 0.42, r * 0.3, 0, 0, TAU); c.fill(); c.stroke();
  c.fillStyle = '#4e9a2e';
  for (const s of [-1, 1]) {
    c.beginPath(); c.ellipse(s * r * 0.16, r * 0.02, r * 0.08, r * 0.11, 0, 0, TAU); c.fill();
  }
  c.restore();
}

// ---- 方块 ----
function drawBlock(b) {
  const p = b.plugin;
  const c = ctx;
  c.save(); c.translate(b.position.x, b.position.y); c.rotate(b.angle);
  const w = p.w, h = p.h;
  if (p.mat === 'wood') {
    let g = c.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, '#d69a58'); g.addColorStop(0.5, '#c98d4b'); g.addColorStop(1, '#b5773a');
    c.fillStyle = g; rr(c, -w / 2, -h / 2, w, h, 3); c.fill();
    c.strokeStyle = '#8a5a26'; c.lineWidth = 2; c.stroke();
    c.strokeStyle = 'rgba(122,74,32,0.55)'; c.lineWidth = 1.5;
    const long = w >= h;
    const n = long ? 2 : 1;
    for (let i = 1; i <= n; i++) {
      c.beginPath();
      if (long) { const y = -h / 2 + h * i / (n + 1); c.moveTo(-w / 2 + 4, y); c.lineTo(w / 2 - 4, y); }
      else { const x = -w / 2 + w * i / (n + 1); c.moveTo(x, -h / 2 + 4); c.lineTo(x, h / 2 - 4); }
      c.stroke();
    }
  } else if (p.mat === 'stone') {
    let g = c.createLinearGradient(0, -h / 2, 0, h / 2);
    g.addColorStop(0, '#c4c4c4'); g.addColorStop(0.5, '#aeaeae'); g.addColorStop(1, '#949494');
    c.fillStyle = g; rr(c, -w / 2, -h / 2, w, h, 4); c.fill();
    c.strokeStyle = '#6f6f6f'; c.lineWidth = 2; c.stroke();
    c.fillStyle = 'rgba(120,120,120,0.4)';
    const s1 = Math.sin(p.crackSeed) * 0.5 + 0.5, s2 = Math.sin(p.crackSeed * 2.7) * 0.5 + 0.5;
    c.beginPath(); c.arc(-w / 2 + w * s1, -h / 2 + h * s2, Math.min(w, h) * 0.09 + 1.5, 0, TAU); c.fill();
    c.beginPath(); c.arc(w / 2 - w * s2, h / 2 - h * s1 * 0.8, Math.min(w, h) * 0.07 + 1, 0, TAU); c.fill();
  } else {
    c.fillStyle = 'rgba(160,222,252,0.68)';
    rr(c, -w / 2, -h / 2, w, h, 3); c.fill();
    c.strokeStyle = 'rgba(90,170,220,0.9)'; c.lineWidth = 2; c.stroke();
    c.strokeStyle = 'rgba(255,255,255,0.65)'; c.lineWidth = 2;
    c.beginPath();
    const d = Math.min(w, h) * 0.5;
    c.moveTo(-w / 2 + 5, -h / 2 + 5 + d * 0.4); c.lineTo(-w / 2 + 5 + d, -h / 2 + 5);
    c.moveTo(-w / 2 + 5, -h / 2 + 5 + d * 0.9); c.lineTo(-w / 2 + 5 + d * 1.5, -h / 2 + 5);
    c.stroke();
  }
  const hpr = p.hp / p.maxHp;
  if (hpr < 0.66) {
    c.strokeStyle = p.mat === 'ice' ? 'rgba(70,130,180,0.8)' : p.mat === 'stone' ? 'rgba(70,70,70,0.7)' : 'rgba(80,48,18,0.7)';
    c.lineWidth = 1.6;
    const s = p.crackSeed;
    const drawCrack = (k) => {
      c.beginPath();
      let px = -w / 2 + w * (0.3 + 0.4 * Math.sin(s + k)), py = -h / 2;
      c.moveTo(px, py);
      for (let i = 1; i <= 3; i++) {
        px += Math.sin(s * (i + k) * 3.1) * w * 0.12;
        py += h / 3;
        c.lineTo(px, py);
      }
      c.stroke();
    };
    drawCrack(0);
    if (hpr < 0.33) drawCrack(2.3);
  }
  c.restore();
}

function drawParticles() {
  const c = ctx;
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    c.save(); c.globalAlpha = clamp(a, 0, 1);
    if (p.type === 'rect') {
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      c.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.7);
    } else if (p.type === 'puff') {
      c.fillStyle = p.color;
      c.beginPath(); c.arc(p.x, p.y, p.size * (0.6 + (1 - a) * 0.8), 0, TAU); c.fill();
    } else if (p.type === 'star') {
      c.translate(p.x, p.y); c.rotate(p.rot);
      c.fillStyle = p.color;
      starPath(c, 0, 0, p.size, p.size * 0.45, 5); c.fill();
    } else if (p.type === 'spark') {
      c.strokeStyle = p.color; c.lineWidth = 2.5; c.lineCap = 'round';
      c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.vx * 0.03, p.y - p.vy * 0.03); c.stroke();
    } else if (p.type === 'flash') {
      c.fillStyle = 'rgba(255,255,240,' + a + ')';
      c.beginPath(); c.arc(p.x, p.y, p.size * (1.2 - a * 0.4), 0, TAU); c.fill();
    } else if (p.type === 'ring') {
      c.strokeStyle = p.color; c.lineWidth = 8 * a;
      c.beginPath(); c.arc(p.x, p.y, p.size * (1 - a) * 1.05 + 12, 0, TAU); c.stroke();
    }
    c.restore();
  }
}

function drawTrail(pts) {
  const c = ctx;
  c.fillStyle = 'rgba(255,255,255,0.75)';
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const rr2 = 3.2 * (i / pts.length * 0.6 + 0.4);
    c.beginPath(); c.arc(p.x, p.y, rr2, 0, TAU); c.fill();
  }
}

// 预测线：与 Matter 相同的逐步积分（frictionAir=0 → 纯抛物线，px/step）
function drawPredict() {
  const g = game.ghost;
  if (!game.dragging || !g) return;
  let x = g.x, y = g.y;
  let vx = (SLING.x - g.x) * LAUNCH_K / 60, vy = (SLING.y - g.y) * LAUNCH_K / 60;
  const c = ctx;
  for (let i = 0; i < 160; i++) {
    vy += GRAV_STEP; x += vx; y += vy;
    if (y > GROUND_Y) break;
    if (i % 4 === 0) {
      const a = 0.8 * (1 - i / 166);
      c.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
      c.beginPath(); c.arc(x, y, 3.4 * (1 - i / 180), 0, TAU); c.fill();
    }
  }
  const k = clamp(Math.hypot(g.x - SLING.x, g.y - SLING.y) / MAX_DRAG, 0, 1);
  c.save();
  c.translate(SLING.x, SLING.y - 70);
  c.fillStyle = 'rgba(0,0,0,0.35)'; rr(c, -36, -8, 72, 14, 7); c.fill();
  c.fillStyle = k > 0.85 ? '#ff5a3c' : k > 0.5 ? '#ffd93d' : '#8fd460';
  rr(c, -33, -5, 66 * k, 8, 4); c.fill();
  c.restore();
}

  }

  c.save();
  c.font = '20px "Microsoft YaHei", sans-serif';
  c.textAlign = 'center'; c.fillStyle = 'rgba(255,255,255,0.92)';
  c.lineWidth = 4; c.strokeStyle = 'rgba(60,30,10,0.6)';
  const lines = [
    '拖拽小鸟瞄准发射 · 飞行中点击屏幕释放技能',
    '黄鸟冲刺 · 蓝鸟分裂 · 黑鸟爆炸 · 消灭所有绿猪即可获胜'
  ];
  lines.forEach((l, i) => {
    c.strokeText(l, VIEW_W / 2, 760 + i * 30);
    c.fillText(l, VIEW_W / 2, 760 + i * 30);
  });
  c.restore();
}

function drawEndPanel() {
  const c = ctx;
  const win = game.state === 'win';
  const t = game.panelT;
  c.save();
  c.fillStyle = 'rgba(20,26,18,' + clamp(t * 1.2, 0, 0.55) + ')';
  c.fillRect(0, 0, VIEW_W, VIEW_H);

  const px = VIEW_W / 2, py = 300;
  const sc = clamp(t * 2.2, 0, 1);
  const ease = 1 + (1 - sc) * (1 - sc) * 2;
  c.translate(px, py); c.scale(ease, ease); c.translate(-px, -py);

  const pw = 560, ph = 400;
  let g = c.createLinearGradient(0, py - ph / 2, 0, py + ph / 2);
  g.addColorStop(0, '#a5713d'); g.addColorStop(1, '#855423');
  c.fillStyle = g;
  rr(c, px - pw / 2, py - ph / 2, pw, ph, 22); c.fill();
  c.strokeStyle = '#5d3a17'; c.lineWidth = 6; c.stroke();
  c.fillStyle = '#5d3a17';
  for (const [dx, dy] of [[-pw / 2 + 18, -ph / 2 + 18], [pw / 2 - 18, -ph / 2 + 18], [-pw / 2 + 18, ph / 2 - 18], [pw / 2 - 18, ph / 2 - 18]]) {
    c.beginPath(); c.arc(px + dx, py + dy, 6, 0, TAU); c.fill();
  }
  c.restore();

  c.save();
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.font = 'bold 52px "Microsoft YaHei", sans-serif';
  c.lineWidth = 8; c.strokeStyle = '#4a2c10';
  const title = win ? '过关！' : '失败了…';
  c.strokeText(title, px, py - 128);
  c.fillStyle = win ? '#ffe14d' : '#ff9d7a';
  c.fillText(title, px, py - 128);

  if (win) {
    for (let i = 0; i < 3; i++) {
      const st = clamp((t - 0.35 - i * 0.28) * 3, 0, 1);
      if (st <= 0) continue;
      const e = st < 1 ? 1 + Math.sin(st * Math.PI) * 0.45 : 1;
      const sx = px + (i - 1) * 105, sy = py - 40;
      c.save();
      c.translate(sx, sy); c.scale(e, e);
      const got = i < game.stars;
      c.fillStyle = got ? '#ffd42a' : 'rgba(255,255,255,0.18)';
      c.strokeStyle = got ? '#c78a00' : 'rgba(255,255,255,0.3)';
      c.lineWidth = 4;
      starPath(c, 0, 0, 42, 19, 5); c.fill(); c.stroke();
      if (got) {
        c.fillStyle = 'rgba(255,255,255,0.5)';
        c.beginPath(); c.ellipse(-10, -12, 10, 6, -0.6, 0, TAU); c.fill();
      }
      c.restore();
    }
    const shown = Math.floor(game.finalScore * clamp(t * 1.5, 0, 1));
    c.font = 'bold 44px "Microsoft YaHei", sans-serif';
    c.lineWidth = 6; c.strokeStyle = '#4a2c10';
    c.strokeText(shown.toLocaleString(), px, py + 55);
    c.fillStyle = '#fff'; c.fillText(shown.toLocaleString(), px, py + 55);
    if (game.bonusShown) {
      c.font = 'bold 22px "Microsoft YaHei", sans-serif';
      c.fillStyle = '#cfeab0';
      c.fillText('剩余小鸟奖励 +' + game.bonusShown.toLocaleString(), px, py + 96);
    }
  } else {
    drawPig(px, py - 40, 52, 1, Math.sin(game.time * 3) > 0.9 ? 0.1 : 0, null, 3);
    c.font = 'bold 26px "Microsoft YaHei", sans-serif';
    c.fillStyle = '#fff';
    c.fillText('哼哼~ 还有绿猪没消灭！', px, py + 55);
    c.fillText('得分 ' + game.finalScore.toLocaleString(), px, py + 92);
  }

  const last = game.levelIdx === LEVELS.length - 1;
  if (win) {
    btn(px - 220, py + 140, 190, 62, '重玩本关', () => game.loadLevel(game.levelIdx));
    if (last) {
      btn(px + 30, py + 140, 190, 62, '通关！回菜单', () => { game.state = 'menu'; }, { c1: '#8fd460', c2: '#5a9e35' });
    } else {
      btn(px + 30, py + 140, 190, 62, '下一关 ▶', () => game.loadLevel(game.levelIdx + 1), { c1: '#8fd460', c2: '#5a9e35' });
    }
  } else {
    btn(px - 220, py + 140, 190, 62, '再试一次', () => game.loadLevel(game.levelIdx), { c1: '#8fd460', c2: '#5a9e35' });
    btn(px + 30, py + 140, 190, 62, '回菜单', () => { game.state = 'menu'; });
  }
  c.restore();
}

// ------------------------- 主绘制 -------------------------
function draw() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, VIEW_W, VIEW_H);
  game.buttons = [];

  if (game.state === 'menu') { drawMenu(); return; }

  const shX = game.shake > 0 ? rand(-game.shake, game.shake) : 0;
  const shY = game.shake > 0 ? rand(-game.shake, game.shake) * 0.6 : 0;
  ctx.save();
  ctx.translate(-game.camX + shX, shY);

  drawSky(game.camX);
  drawHills(game.camX);
  drawClouds();
  drawGround();

  if (game.lastTrail.length) drawTrail(game.lastTrail);
  const main0 = game.activeBirds[0];
  if (main0 && main0.plugin.trail && main0.plugin.trail.length) drawTrail(main0.plugin.trail);

  drawSlingArm();
  drawBandBack();

  // 阴影（鸟/猪）
  ctx.fillStyle = 'rgba(30,60,15,0.18)';
  for (const b of game.bodies()) {
    const p = b.plugin;
    if (!p || (p.kind !== 'bird' && p.kind !== 'pig')) continue;
    const bottom = b.position.y + p.r;
    if (bottom < GROUND_Y - 40) {
      ctx.beginPath();
      ctx.ellipse(b.position.x, GROUND_Y + 4, p.r * 0.9 * clamp(1 - (GROUND_Y - bottom) / 700, 0.3, 1), p.r * 0.22, 0, 0, TAU);
      ctx.fill();
    }
  }

  const lookTarget = main0 ? main0.position : (game.ghost ? { x: game.ghost.x, y: game.ghost.y } : null);
  for (const b of game.bodies()) {
    const p = b.plugin;
    if (!p) continue;
    if (p.kind === 'block') drawBlock(b);
    else if (p.kind === 'pig') drawPig(b.position.x, b.position.y, p.r, clamp(p.hp / p.maxHp, 0, 1), p.blink, lookTarget, b.id);
    else if (p.kind === 'bird') {
      const sp = b.speed * 60;
      const ang = sp > 60 ? Math.atan2(b.velocity.y, b.velocity.x) * 0.35 + b.angle * 0.5 : b.angle;
      drawBird(b.position.x, b.position.y, p.r, p.type, ang);
    }
  }

  if (game.ghost) {
    const g0 = game.ghost;
    const lt = clamp(game.loadT, 0, 1);
    const c1 = 1.70158, c3 = c1 + 1;
    const e = 1 + c3 * Math.pow(lt - 1, 3) + c1 * Math.pow(lt - 1, 2);
    const sc2 = clamp(Math.max(0.05, e), 0.05, 1.15);
    const k = Math.hypot(g0.x - SLING.x, g0.y - SLING.y) / MAX_DRAG;
    const ang = game.dragging ? Math.atan2(SLING.y - g0.y, SLING.x - g0.x) * 0.3 : 0;
    drawBird(g0.x, g0.y, BIRD_TYPES[g0.type].r * sc2, g0.type, ang);
    if (game.dragging && k > 0.25) {
      ctx.save();
      ctx.globalAlpha = 0.35 + k * 0.4;
      drawBird(g0.x + (SLING.x - g0.x) * 0.18, g0.y + (SLING.y - g0.y) * 0.18 - 16, 13, g0.type, 0);
      ctx.restore();
    }
  }

  drawBandFront();
  drawPredict();
  drawParticles();
  drawScorePops();

  ctx.restore();

  drawHUD();
  if (game.state === 'win' || game.state === 'lose') drawEndPanel();
}

// ------------------------- 主循环 -------------------------
let lastT = performance.now();
function loop(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = clamp(dt, 0, 0.05);
  try {
    game.update(dt);
    draw();
  } catch (err) {
    if (console && console.error) console.error('游戏帧异常：', err);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
